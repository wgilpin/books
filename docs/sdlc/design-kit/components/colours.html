<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Colours</title><link rel="stylesheet" href="../tokens.css"></head>
<body>
<div style="display:grid;grid-template-columns:repeat(auto-fill,120px);gap:12px"><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--bg)"></div><small>bg</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--surface)"></div><small>surface</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--text)"></div><small>text</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--muted)"></div><small>muted</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--border)"></div><small>border</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--primary)"></div><small>primary</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--danger)"></div><small>danger</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--hugo)"></div><small>hugo</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--nebula)"></div><small>nebula</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--clarke)"></div><small>clarke</small></div><div><div style="height:56px;border-radius:6px;border:1px solid var(--border);background:var(--bsfa)"></div><small>bsfa</small></div></div>
</body></html>
