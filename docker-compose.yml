services:
  app:
    build: .
    image: books-app
    container_name: books-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    # APP_PASSWORD and SESSION_SECRET. The server refuses to start without them.
    env_file:
      - .env
    volumes:
      - books-data:/app/data
    # Caddy reaches the app by container name on this shared network.
    networks:
      - web-routing
      - default

  backup:
    image: books-app
    container_name: books-backup
    restart: unless-stopped
    depends_on:
      - app
    command: ['sh', '/app/scripts/backup/backup.sh']
    volumes:
      - books-data:/app/data
      - ./backups:/backups

volumes:
  books-data:
    name: books-data

# The shared network the Caddy reverse proxy lives on. Caddy routes
# books.teleosis.ai to books-app through dynamic upstreams. See docs/deploy.md.
networks:
  web-routing:
    external: true
